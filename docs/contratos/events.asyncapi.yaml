asyncapi: 3.0.0
info:
  title: Eventos de Lançamentos
  version: 1.0.0
  description: Fatos publicados por Lançamentos. A entrega é at-least-once e sem garantia de ordem.
defaultContentType: application/json
servers:
  gcp:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Pub/Sub no GCP
channels:
  entries:
    address: entries-recorded-v1
    description: Tópico com os lançamentos registrados, incluindo estornos
    messages:
      entryRecorded:
        $ref: '#/components/messages/entryRecorded'
operations:
  publishEntry:
    action: send
    summary: O publicador da outbox envia o evento
    channel:
      $ref: '#/channels/entries'
    messages:
      - $ref: '#/channels/entries/messages/entryRecorded'
  consolidateEntry:
    action: receive
    summary: O consumidor do Consolidado aplica o evento ao saldo
    channel:
      $ref: '#/channels/entries'
    messages:
      - $ref: '#/channels/entries/messages/entryRecorded'
components:
  messages:
    entryRecorded:
      name: entry.recorded
      title: Lançamento registrado
      contentType: application/json
      headers:
        type: object
        description: Atributos da mensagem no Pub/Sub
        properties:
          eventId:
            type: string
            format: uuid
            description: Igual ao `eventId` do corpo
          type:
            const: entry.recorded
          traceparent:
            type: string
            description: Contexto W3C do traço da requisição que registrou o lançamento. Ausente quando não houve traço
      payload:
        $ref: './entry-recorded.v1.schema.json'
      examples:
        - name: credit
          payload:
            eventId: 01a1acc4-a32c-7d3c-9b21-5c1e8f0d2b77
            type: entry.recorded
            version: 1
            occurredAt: '2026-11-05T17:32:10.412+00:00'
            merchantId: 3a7d1c44-0f6e-4f55-8d2a-1b9c2e6f7a10
            entryId: 01a1acc4-a32c-7d3c-9b21-5c1e8f0d2b77
            entryType: CREDIT
            amountCents: 35000
            accountingDate: '2026-11-05'
            reversalOf: null
